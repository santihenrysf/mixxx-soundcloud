# Compila el instalador de Windows de Mixxx + seccion SoundCloud.
name: Windows installer (SoundCloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 2022 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      BUILDENV_BASEPATH: C:\buildenv
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tags are fetched
        run: git fetch origin --force --tags

      - name: Set up cmake
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.21.x"

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up build environment
        shell: cmd
        run: tools\windows_buildenv.bat setup
        env:
          BUILDENV_RELEASE: TRUE

      - name: Create build directory
        run: mkdir build

      - name: Configure
        working-directory: build
        env:
          CC: cl
          CXX: cl
        run: >-
          cmake
          -DBULK=ON
          -DFFMPEG=OFF
          -DHSS1394=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMEDIAFOUNDATION=ON
          -DMODPLUG=ON
          -DQT6=ON
          -DWAVPACK=ON
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DWARNINGS_FATAL=OFF
          -DDEBUG_ASSERTIONS_FATAL=OFF
          -DBUILD_TESTING=OFF
          -DBUILD_BENCH=OFF
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=OFF
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          ..

      - name: Set up MSVC problem matcher
        uses: ammaraskar/msvc-problem-matcher@0.3.0

      - name: Build
        working-directory: build
        run: cmake --build . --config RelWithDebInfo

      - name: Package
        working-directory: build
        run: cpack -G WIX -V

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-SoundCloud-Windows
          path: build/*.msi
          if-no-files-found: error
